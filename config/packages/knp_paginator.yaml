# config/packages/knp_paginator.yaml
knp_paginator:
    page_range: 5    # Nombre de pages à afficher dans la pagination
    default_options:
        page_name: page       # Nom du paramètre de la page dans l'URL (par défaut : 'page')
        sort_field_name: sort # Nom du paramètre de tri dans l'URL
        sort_direction_name: direction # Nom du paramètre de direction du tri
        filter_field_name: filterField # Nom du paramètre de filtre
        filter_value_name: filterValue # Nom du paramètre de valeur de filtre
    template:
       
        sortable: 'knp_paginator.sortable'      # Le template de tri à utiliser
        pagination: '@KnpPaginator/Pagination/sliding.html.twig'
   #     filterable: 'knp_paginator.filterable'  # Le template de filtre à utiliser
